<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Errante demo</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#07090f;color:#e6e9f2;font-family:system-ui,'Segoe UI',sans-serif}
.slide{display:none;width:100vw;height:100vh;padding:6vh 7vw;flex-direction:column;justify-content:center;gap:2vh}
.slide.active{display:flex}.kicker{font-size:2.5vh;color:#7cc4ff;letter-spacing:.08em}h1{font-size:9vh;line-height:1.05;margin:0}h2{font-size:6vh;margin:0}p{font-size:3vh;line-height:1.4;margin:0}.team{font-size:2.8vh}.members{font-size:2.5vh;max-width:86vw}.credits{font-size:2.1vh;line-height:1.4;overflow-wrap:anywhere}.url{color:#7cc4ff;font-size:3.3vh;overflow-wrap:anywhere}footer{margin-top:2vh;font-size:2vh;color:#8e97ad}
</style></head><body>
<section class="slide active"><div class="kicker">NASA SPACE APPS CHALLENGE 2026</div>
<h1>Errante</h1><p>Watch the infrared sky change.</p>
<p class="team">Team: $team</p><p class="members">$members</p>
<footer>Challenge: $challenge · Real NASA SPHEREx observations</footer></section>
<section class="slide"><div class="kicker">EXPLORE THE OBSERVATIONS</div>
<h2>Turn observations into questions.</h2><p class="url">$app_url</p>
<p class="team">Team: $team</p><p class="members">$members</p>
<div class="credits">$credits</div><footer>Challenge: $challenge</footer></section>
<script>const n=parseInt(location.hash.slice(1),10)||1;document.querySelectorAll('.slide').forEach((s,i)=>s.classList.toggle('active',i===n-1));</script>
</body></html>
