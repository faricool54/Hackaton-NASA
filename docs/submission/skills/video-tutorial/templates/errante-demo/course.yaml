name: Errante — NASA Space Apps demo
language: en
audience: NASA Space Apps judges and first-time visitors
depth: product demonstration
target_duration: "28–29 seconds including titles, pauses and credits"
video: {width: 1920, height: 1080, fps: 30}
voice:
  engine: edge-tts
  name: en-US-JennyNeural
  rate: "+0%"
  pitch: "+0Hz"
  candidates:
    - [jenny, en-US-JennyNeural, "+0%", "+0Hz"]
    - [guy, en-US-GuyNeural, "+0%", "+0Hz"]
  pronunciation: {SPHEREx: "sphere ex"}
  pacing: {lead_in: 0.15, row_gap: 0.25, tail: 0.6}
recording:
  enabled: true
  base_url: https://errante.34-148-242-13.sslip.io
  color_scheme: dark
  sso_hosts: []
  local_storage: {}
  write_guard:
    enabled: true
    # Only the real scientific comparison operation, prepared off camera; no coordinate jobs.
    allow: ["POST /api/fields/barnards-star/comparisons"]
deck: {enabled: true, design_system: neutral}
delivery:
  final: true
  max_duration_seconds: 30
  target_duration_seconds: 29
  required_language: en
  require_identity: true
  team: ""                 # Confirm the registered team name; do not infer it from the product name.
  members: []              # Confirm accepted members; these names appear on both cards.
  challenge: Planet X and SPHEREx
  description: >-
    Errante makes real NASA SPHEREx observations accessible through sky search,
    dated image sequences and scientific products with uncertainty and quality information.
    This demo records the real application with prepared observations. Separate shots
    do not represent an uninterrupted archive-processing job. Narration is in English;
    no subtitles are included.
    This research has made use of the NASA/IPAC Infrared Science Archive, which is funded
    by the National Aeronautics and Space Administration and operated by the California
    Institute of Technology.
    This publication makes use of data products from the Spectro-Photometer for the History
    of the Universe, Epoch of Reionization and Ices Explorer (SPHEREx), which is a joint
    project of the Jet Propulsion Laboratory and the California Institute of Technology,
    and is funded by the National Aeronautics and Space Administration.
  credits:
    - "Observation data: NASA SPHEREx / JPL-Caltech / Caltech-IPAC IRSA."
    - "Data archive: https://irsa.ipac.caltech.edu/data/SPHEREx/"
    - "Data DOIs: DR1 10.26131/IRSA678; QR3 10.26131/IRSA662; cube 10.26131/IRSA679."
    - "Sky map interface: Aladin Lite / CDS."
  ai_audio_credit: "AI-generated English narration: Microsoft Edge TTS."
  metadata:
    title: Errante — watch the infrared sky change
    artist: Errante project team
    comment: >-
      Screen recordings of the real Errante application; scientific images are observation products.
      This research has made use of the NASA/IPAC Infrared Science Archive, which is funded
      by the National Aeronautics and Space Administration and operated by the California
      Institute of Technology.
      This publication makes use of data products from the Spectro-Photometer for the History
      of the Universe, Epoch of Reionization and Ices Explorer (SPHEREx), which is a joint
      project of the Jet Propulsion Laboratory and the California Institute of Technology,
      and is funded by the National Aeronautics and Space Administration.
sources:
  platform: Errante
  docs: []                 # Point to the project's docs/SUBMISSION_GUIDE.md and docs/CHALLENGE.md.
  notes: >-
    Within approximately the first 10 seconds, communicate Errante's distinguishing
    value: a public explorer connecting real NASA images, spectra and light curves.
    Demonstrate the advantage in the following shots rather than claiming an
    unverified ranking or exclusivity.
    Use real curated fields, not simulated fixtures. Preserve dates, wavelengths,
    quality warnings and catalog-prediction labels. Confirm all content against
    the deployed app before recording. The map is a context coadd, not a time sequence.
