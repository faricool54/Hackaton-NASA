# course.yaml -- everything that belongs to one course. It lives at the course root; every
# script finds it by walking up from the folder it is given. Keys left out take the
# defaults in scripts/course.py. The setup wizard writes this file; edit it freely after.

name: "Curso de ejemplo"           # shown in docs and descriptions
language: es                       # language of the narration, slides and descriptions (es, en, pt...)
audience: "todo el equipo, técnicos y no técnicos"
depth: "principiante"              # how deep concepts go: principiante | intermedio | avanzado
target_duration: "1-4 min"         # descriptive only; delivery.max_duration_seconds enforces a limit

video:
  width: 1920
  height: 1080
  fps: 30

folders:
  production: internal             # one folder per video: script, deck, takes, narration
  publish: export                  # what gets published: final .mp4 + description

voice:
  engine: edge-tts                 # edge-tts (free Microsoft neural voices) | human (experimental)
  name: es-MX-DaliaNeural          # the course voice: pick it by ear, then do not change it per video.
                                   # A Kokoro voice (ef_dora, em_alex: local, offline) is recognized by its name.
  rate: "+0%"                      # a video can override it with `velocidad: '+5%'` in its script frontmatter.
                                   # Kokoro reads it as a speed multiplier: +5% -> 1.05
  pitch: "+0Hz"                    # edge-tts only
  kokoro_python: ""                # Python with kokoro installed; empty = the venv kokoro_setup.py creates
  candidates:                      # rendered by `voces.py <course>` to pick the voice by ear; engines may mix
    - [dalia, es-MX-DaliaNeural, "+0%", "+0Hz"]
    - [jorge, es-MX-JorgeNeural, "+0%", "+0Hz"]
    # - [dora, ef_dora, "+0%", "+0Hz"]   # a Kokoro voice: needs kokoro_setup.py first
  # Respellings applied only to the text sent to the voice -- scripts, slides and the UI keep the real
  # names. Keys may be phrases; matching is case-sensitive and runs top to bottom, so a phrase goes
  # before the single word it contains ("System prompt" before "prompt"). Grows with every iteration.
  pronunciation: {}
  pacing:                          # seconds of silence around the narration
    lead_in: 0.2
    row_gap: 0.4
    tail: 0.6

recording:                         # demo takes recorded with Playwright (grabar.py)
  enabled: false
  base_url: ""                     # e.g. https://app.example.com
  sso_hosts: [okta]                # a redirect to one of these hosts means: sign in again (grabar.py --login)
  profile: ""                      # browser profile name (default: the course folder's name), or an absolute path
  color_scheme: light
  local_storage: {}                # values set before the app loads, e.g. {theme: light, seasonal: "off"}
  blur_selectors: []               # CSS selectors blurred in every take: real names, teams, figures
  write_guard:
    enabled: false                 # true: every non-read request to the app is aborted unless allowed below
    allow: []                      # e.g. ["POST /api/search", "POST /api/preview*"]

deck:
  enabled: true                    # slides exported from presentacion.html
  design_system: neutral           # neutral | rappi | custom
  # Only for custom:
  # tokens: {primary: "#0a7cff", primary_container: "#e6f1ff", on_primary_container: "#0a7cff",
  #          primary_container_dark: "#0b2545", on_primary_container_dark: "#a9cfff"}
  # font: {family: "'Inter', system-ui, sans-serif", name: Inter, files: {400: /path/Inter-Regular.woff2}}

# Free-form context the wizard gathered: where the content comes from.
sources:
  platform: ""                     # the product the course is about, if any
  docs: []                         # URLs or paths: docs, specs, repos, wikis
  notes: ""                        # MCP servers, browser access, people to ask...

# Optional strict delivery. For the English 30-second Errante demo use
# scaffold.py demo <folder>; see reference/errante-demo.md.
delivery:
  final: false                     # true requires a current final MP4, manifest, credits and tags
  max_duration_seconds: null       # numeric cap on the actual MP4, including all silence/titles
  target_duration_seconds: null    # optional recommended margin below the cap
  required_language: ""            # en for English narration; no subtitles are created
  require_identity: false
  team: ""
  members: []
  challenge: ""
  description: ""                  # generates descripcion.md only if it does not already exist
  credits: []                      # exact source statements required in description and MP4 comment
  ai_audio_credit: ""              # required in final mode for non-human narration
  metadata: {}                     # e.g. {title: Demo, artist: Team}; credits append to comment
