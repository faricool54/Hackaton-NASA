# Showcase fields for `errante build <id>` ("golden fields": precomputed, also the demo's plan B).
# WS3 curates this list, WS1 checks SPHEREx coverage (errante search --ra --dec). Facts: docs/SCIENCE.md §0.
#
# Rules:
# - Coordinates: ICRS degrees. The 5 official test targets are centred on their position PROPAGATED (linear
#   proper motion from J2000) to the MEAN EPOCH of their SPHEREx frames (DR1+QR3 SIA, 2026-11-14).
# - Astrometry in the comments (J2000, pm, plx) comes from Sesame/SIMBAD at CfA, queried 2026-11-14
#   (CDS Strasbourg was down). Reference epoch J2000.0, pm in mas/yr (pm_ra includes cos(dec)).
# - FieldConfig (pipeline/errante/build.py) only accepts: id, name, ra, dec, size_deg, description, tags,
#   detectors, mjd_min, mjd_max, max_frames, track_object. Anything else MUST stay in comments
#   (pm/plx/epoch could move to the contract as an optional Field.target in a future version).
# - R05 requires Barnard's Star, Epsilon Indi B, WISE 0855, RW Aurigae and R Draconis. These are development
#   presets with sourced astrometry; the validation records are in docs/validation/ (protocol: docs/VALIDATION.md).
# - size_deg >= 0.15 (~9') so the target never falls off the cutout.
# - Careful: max_frames (default 40) currently keeps the FIRST frames by time (build.py), i.e. one season
#   only. Do not rely on it until build.py selects frames per season x detector.
# - Moving solar-system targets (track_object) must be re-centred with a JPL Horizons ephemeris at the
#   observation dates; never hard-code them.

[[field]]
id = "barnards-star"
name = "Barnard's Star"
description = "Official test target. Highest proper-motion star in the sky (~10.4\"/yr): ~1.9 SPHEREx pixels over the DR1+QR3 baseline (1.66 px measured offline on the FITS files between the Aug 2025 and Aug 2026 seasons). Saturated core: image brightness is not a measurement."
# J2000 269.45207696 +4.69336497 | pm (-801.551, +10362.394) mas/yr | plx 546.976 mas | M4V, K=4.5
# Source: Sesame/SIMBAD CfA 2026-11-14. Mean epoch of SPHEREx data: MJD 61104 (2026.17).
# SPHEREx: 358 frames (dr1 239 + qr3 119), 3 seasons; total shift 11.5" = 1.86 px in 1.10 yr.
# Previous centre (269.4463, 4.7665) was the 2025.5 position; now centred on the mean epoch (~8" north).
ra = 269.44623
dec = 4.76870
size_deg = 0.15
tags = ["official-target", "proper-motion", "validation"]

[[field]]
id = "eps-indi-b"
name = "Epsilon Indi B"
description = "Official test target. Pair of T brown dwarfs (Ba+Bb, unresolved at 6.15\"/px) orbiting the bright star eps Ind A, ~402\" away. ~1.1 SPHEREx pixels of motion over the baseline."
# J2000 331.04414659 -56.7828442 | pm (+3981.977, -2466.832) mas/yr | plx 270.658 mas (Gaia DR3) | T1V+T6V
# Source: Sesame/SIMBAD CfA 2026-11-14 (SIMBAD has no separate Ba/Bb entries). Gaia DR3 6412596012146801152.
# Mean epoch of SPHEREx data: MJD 61042 (2026.00).
# SPHEREx: 460 frames in SIA (dr1 340 + qr3 120), 4 seasons; total shift 6.7" = 1.10 px in 1.44 yr.
# D1/D4 almost empty in the first season (3 frames) and absent in the last one.
# eps Ind A (J2000 330.84022 -56.78598) is ~402" WEST: outside this 0.15 deg box; size_deg >= 0.25 includes
# it (useful to show GHOST/HALO contamination flags, at the cost of more bytes per frame).
ra = 331.09665
dec = -56.80066
size_deg = 0.15
tags = ["official-target", "brown-dwarf", "proper-motion"]

[[field]]
id = "wise-0855"
name = "WISE 0855−0714"
description = "Official test target. Coldest known brown dwarf, ~2.3 pc away, ~8.2\"/yr. Extremely red (J=25, W2=13.7): SPHEREx sees it only at 3.8–5.0 µm (D5–D6), faint in single exposures. Only DR1 data so far: ~1.4 SPHEREx pixels of motion."
# J2000 133.81890825 -7.247048 | pm (-8123.7, +673.2) mas/yr | plx 439.0 mas | Y2, J=25.0, H=23.8
# Source: Sesame/SIMBAD CfA 2026-11-14. AllWISE: W1=16.23, W2=13.70 (Vega).
# Mean epoch of SPHEREx data: MJD 61035 (2025.99).
# Challenge coordinate 08h55m10.831s -7d14m42.53s = (133.79513, -7.24515) is the ~2010 position: at the mean
# epoch the object is ~126" (~20 px) WEST of it (still inside this box). Old centre was that coordinate.
# SPHEREx: 258 frames, ALL dr1 (0 in qr3), 3 seasons; total shift 8.3" = 1.36 px in 1.02 yr.
# Visible only in D5/D6, also in single exposures (docs/validation/wise-0855.md).
ra = 133.75980
dec = -7.24219
size_deg = 0.15
tags = ["official-target", "brown-dwarf", "proper-motion"]

[[field]]
id = "rw-aurigae"
name = "RW Aurigae"
description = "Official test target. Young T Tauri star (A+B, 1.5\" apart, unresolved): it does not move, it changes brightness. Saturated in D2–D6; measured offline on unsaturated D1 exposures at matched wavelength, it brightened by about 1 mag (0.75–0.77 µm) from Sep 2025 to Sep 2026. In the B/W blink only the D1 frames can show it (a 2.6x display-level brightness ratio between 2025W36_1A_0233_3D1 and 2026W37_1A_0234_3D1, measured on the published images); the D2–D6 cores are saturated. Brightness for science comes from the FITS light curve below, which plots those D1 measurements of the blended pair; saturation removes most exposures of the bright state."
# J2000 76.95652603 +30.40143817 | pm (+7.23, -20.33) mas/yr (Hipparcos) | plx 15.42 mas (Hipparcos);
# Gaia DR3: RW Aur A = 156430817820015232 (plx 5.454 mas, RUWE 16.4, unreliable; pm (+4.906, -24.578));
# RW Aur B = 156430822114424576 (plx 6.406 mas, pm (+2.641, -27.398)); WDS JOY 5 A,BC 1.50" PA 254 (2022),
# so A+B fall in one SPHEREx pixel (6.15") | K1/5e+K5e, J=8.4, K=7.0
# Source: Sesame/SIMBAD CfA 2026-11-14 (SIMBAD lists it as TT*, no period).
# Mean epoch of SPHEREx data: MJD 61107 (2026.18). Ecliptic latitude +7.5 deg: asteroids may cross the field.
# SPHEREx: 335 frames (dr1 226 + qr3 109), 3 seasons, ~18-19 frames per detector and season.
ra = 76.95659
dec = 30.40129
size_deg = 0.15
tags = ["official-target", "variable"]

[[field]]
id = "r-draconis"
name = "R Draconis"
description = "Official test target. Mira variable (catalog period 245.6–247.2 d), 8.6° from the north ecliptic pole. Saturated in every exposure: measured offline in the PSF wings on all 2,493 SPHEREx exposures, it shows a 0.5–1.3 mag cycle of ~260 d in 2025–2026, in phase with AAVSO. The light curve below uses the wide survey only (539 exposures), so its period range (240–276 d) cannot tell ~260 d from the catalog value. Image brightness here is not a measurement."
# J2000 248.16761083 +66.75497942 | pm (-20.643, +6.149) mas/yr | plx 1.2509 mas | Mira, M4.5-6+e
# Source: Sesame/SIMBAD CfA 2026-11-14; period 247.2 d (Gaia DR3 vari, SIMBAD mesVar).
# Mean epoch of SPHEREx data: MJD 61115 (2026.20).
# SPHEREx: 2493 frames (dr1 413 + dr1_deep 1225 + qr3 126 + qr3_deep 729); D2/D5 only ~89 each.
# Heavy: build it with mjd_min/mjd_max or time bins, never all frames live.
ra = 248.16723
dec = 66.75502
size_deg = 0.15
tags = ["official-target", "variable", "deep-field"]

# Deep fields: tens of thousands of frames per position (NEP: 29,402 in SIA dr1+dr1_deep+qr3+qr3_deep,
# verified 2026-11-14; SEP not measured). Do NOT use live; only offline with mjd_min/mjd_max or time bins.
[[field]]
id = "nep-deep"
name = "North ecliptic pole deep field"
description = "SPHEREx deep field: many more epochs than the all-sky survey."
ra = 270.0
dec = 66.5607
size_deg = 0.25
tags = ["deep-field"]

[[field]]
id = "sep-deep"
name = "South ecliptic pole deep field"
description = "The other SPHEREx deep field."
ra = 90.0
dec = -66.5607
size_deg = 0.25
tags = ["deep-field"]

# P2 (only if time allows): an ecliptic field with a bright known main-belt asteroid (pick it with JPL
# SBIdent / SkyBoT on a real frame) to show motion within a season. DROP: Planet Nine region, TNO tracking.
