name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Many agents push often: cancel superseded runs of the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Advisory: does a wsN/... PR only touch files of its workstream? (docs/COLLABORATION.md)
  owners:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ownership guard
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: python3 scripts/owners.py --base origin/${{ github.base_ref }}

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pipeline/pyproject.toml
            backend/pyproject.toml
      - run: pip install -e "pipeline[dev]" -e "backend[dev]"
      - name: Lint
        run: |
          ruff check pipeline backend scripts
          ruff format --check pipeline backend scripts
      - name: Contract (schema up to date)
        run: errante schema --check
      - name: Demo data valid
        run: errante validate --dir data/demo
      - name: Tests
        run: pytest -q pipeline/tests backend/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production API
        run: docker build -f backend/Dockerfile -t errante-api .
      - name: Start production API
        run: docker run -d --name api-smoke -p 8000:8000 errante-api
      - name: Smoke test
        run: |
          curl --fail --retry 15 --retry-all-errors --retry-delay 1 --connect-timeout 2 --max-time 5 http://127.0.0.1:8000/api/health
          curl --fail http://127.0.0.1:8000/api/manifest
      - name: Container logs
        if: failure()
        run: docker logs api-smoke
      - name: Stop container
        if: always()
        run: docker rm -f api-smoke

  windows-backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pipeline/pyproject.toml
            backend/pyproject.toml
      - run: pip install -e "pipeline[dev]" -e "backend[dev]"
      - run: pytest -q backend/tests
